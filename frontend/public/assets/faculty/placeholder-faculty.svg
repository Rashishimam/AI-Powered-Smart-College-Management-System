<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" fill="none">
  <rect width="240" height="280" rx="16" fill="#0a192f"/>
  <rect x="1" y="1" width="238" height="278" rx="15" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle background glow -->
  <circle cx="120" cy="110" r="70" fill="#3b82f6" fill-opacity="0.1"/>
  
  <!-- Academic Cap / Silhouette -->
  <g transform="translate(60, 50)" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cap top -->
    <path d="M60 10 L110 35 L60 60 L10 35 Z" fill="#1e293b" stroke="#e2e8f0"/>
    <!-- Tassel -->
    <path d="M110 35 L110 65 C110 70 105 75 105 80" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="105" cy="82" r="3" fill="#f59e0b"/>
    
    <!-- Head -->
    <circle cx="60" cy="85" r="28" fill="#1e293b" stroke="#94a3b8"/>
    
    <!-- Shoulders -->
    <path d="M15 155 C15 125 35 120 60 120 C85 120 105 125 105 155" fill="#1e293b" stroke="#94a3b8"/>
  </g>
  
  <!-- Institutional Branding Text -->
  <text x="120" y="235" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">RVSCET FACULTY</text>
  <text x="120" y="254" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">Official Profile</text>
</svg>
